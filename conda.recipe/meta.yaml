{% set pyproject = load_file_data("pyproject.toml") %}
{% set project = pyproject.get("project", {}) %}

package:
  name: {{ project.get("name") | lower }}
  version: {{ project.get("version") }}

source:
  path: ..

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python >=3.9
    - pip
    - setuptools >=68
    - wheel
  run:
    - python >=3.9
    - numpy >=1.24
    - scipy >=1.10
    - cmake >=3.18
    - requests >=2.31

test:
  imports:
    - maxwelllink
  commands:
    - python -c "import numpy, requests, scipy"
    - cmake --version
    - mxl --help
    - mxl_driver --help

about:
  home: https://github.com/TaoELi/MaxwellLink
  summary: A unified framework for self-consistent light-matter simulations
  description: |
    MaxwellLink couples classical electromagnetic solvers to external molecular
    drivers through a modular socket interface.
  license: GPL-2.0-only
  license_file: LICENSE
  doc_url: https://taoeli.github.io/MaxwellLink
  dev_url: https://github.com/TaoELi/MaxwellLink

extra:
  recipe-maintainers:
    - TaoELi
